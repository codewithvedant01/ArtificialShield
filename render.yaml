services:
  - type: web
    name: artificialshield
    runtime: python
    buildCommand: pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
    startCommand: uvicorn app.gateway:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_NAME
        value: ProtectAI/deberta-v3-base-prompt-injection-v2
      - key: THRESHOLD
        value: "0.85"
